<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240">
  <title>Blue Rocket Co. - Horizontal Lockup</title>
  <desc>Horizontal lockup. Mark on left, wordmark on right. For headers, email signatures, document footers.</desc>

  <!-- Mark on left, scaled to ~200px tall -->
  <g transform="translate(40, 20) scale(0.71)">
    <rect x="20" y="20" width="160" height="240" rx="80" ry="80" fill="none" stroke="#0B2545" stroke-width="3"/>
    <path d="M 65 95 Q 65 50, 100 50 Q 135 50, 135 95 L 135 195 L 65 195 Z" fill="#0B2545"/>
    <circle cx="100" cy="95" r="14" fill="#1B98D4"/>
    <rect x="73" y="205" width="10" height="28" rx="4" fill="#1B98D4" opacity="0.85"/>
    <rect x="93" y="205" width="10" height="40" rx="4" fill="#1B98D4"/>
    <rect x="113" y="205" width="10" height="28" rx="4" fill="#1B98D4" opacity="0.85"/>
  </g>

  <!-- Wordmark on right, vertically centered -->
  <text x="200" y="138" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="500" fill="#0B2545" letter-spacing="-0.8">Blue Rocket Co.</text>
</svg>
