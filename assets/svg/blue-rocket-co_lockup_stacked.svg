<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">
  <title>Blue Rocket Co. - Stacked Lockup</title>
  <desc>Primary stacked lockup. Mark above wordmark, centered. For hero sections, business cards, social avatars.</desc>

  <!-- Mark (centered) -->
  <g transform="translate(100, 20)">
    <rect x="20" y="20" width="160" height="240" rx="80" ry="80" fill="none" stroke="#0B2545" stroke-width="3"/>
    <path d="M 65 95 Q 65 50, 100 50 Q 135 50, 135 95 L 135 195 L 65 195 Z" fill="#0B2545"/>
    <circle cx="100" cy="95" r="14" fill="#1B98D4"/>
    <rect x="73" y="205" width="10" height="28" rx="4" fill="#1B98D4" opacity="0.85"/>
    <rect x="93" y="205" width="10" height="40" rx="4" fill="#1B98D4"/>
    <rect x="113" y="205" width="10" height="28" rx="4" fill="#1B98D4" opacity="0.85"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="370" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="500" fill="#0B2545" text-anchor="middle" letter-spacing="-0.8">Blue Rocket Co.</text>
</svg>
