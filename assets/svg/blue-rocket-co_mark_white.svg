<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <title>Blue Rocket Co. - Primary Mark (White for Dark Backgrounds)</title>
  <desc>White version of the capsule badge mark. For use on dark or photographic backgrounds.</desc>

  <!-- Capsule badge outline -->
  <rect x="20" y="20" width="160" height="240" rx="80" ry="80" fill="none" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Rocket body -->
  <path d="M 65 95 Q 65 50, 100 50 Q 135 50, 135 95 L 135 195 L 65 195 Z" fill="#FFFFFF"/>

  <!-- Window (accent stays blue) -->
  <circle cx="100" cy="95" r="14" fill="#1B98D4"/>

  <!-- Three-bar thrust -->
  <rect x="73" y="205" width="10" height="28" rx="4" fill="#1B98D4"/>
  <rect x="93" y="205" width="10" height="40" rx="4" fill="#1B98D4"/>
  <rect x="113" y="205" width="10" height="28" rx="4" fill="#1B98D4"/>
</svg>
