<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="200" height="280">
  <title>Blue Rocket Co. - Monochrome Mark</title>
  <desc>Single-color version of the mark. For print, embroidery, single-color reproduction, or watermarks. Use any solid color.</desc>

