  <path d="M 65 95 Q 65 50, 100 50 Q 135 50, 135 95 L 135 195 L 65 195 Z" fill="#0B2545"/>
  <circle cx="100" cy="95" r="14" fill="#FFFFFF"/>
  <rect x="73" y="205" width="10" height="28" rx="4" fill="#0B2545"/>
  <rect x="93" y="205" width="10" height="40" rx="4" fill="#0B2545"/>
  <rect x="113" y="205" width="10" height="28" rx="4" fill="#0B2545"/>
</svg>
